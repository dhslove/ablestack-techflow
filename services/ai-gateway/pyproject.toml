[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "techflow-ai-gateway"
version = "0.13.0"
description = "TechFlow AI Gateway with Chat-based Community review and approval"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "psycopg[binary,pool]==3.3.4",
  "openai==2.53.0",
  "tree-sitter==0.26.0",
  "tree-sitter-language-pack==1.14.2",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["data/*.json", "data/golden-artifacts/*.png"]
