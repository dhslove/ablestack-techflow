name: techflow-ai-gateway

services:
  database:
    image: pgvector/pgvector:pg14@sha256:57a17a3a78a68d161035fd8a875f5cf7c41fc88f8d7193d9a15a3282f593bda7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TECHFLOW_RAG_DATABASE_NAME:-techflow_rag}
      POSTGRES_USER: techflow_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
    secrets:
      - bootstrap_password
      - app_password
      - migration_password
      - fetcher_password
    volumes:
      - techflow_rag_database:/var/lib/postgresql/data
      - ../../../services/ai-gateway/migrations/0000_extensions_roles_up.sql:/docker-entrypoint-initdb.d/000_extensions_roles.sql:ro
      - ./scripts/bootstrap-login-roles.sh:/docker-entrypoint-initdb.d/001_bootstrap_login_roles.sh:ro
    networks:
      - rag_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techflow_bootstrap -d ${TECHFLOW_RAG_DATABASE_NAME:-techflow_rag}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  migrate:
    image: techflow/ai-gateway:${TECHFLOW_RAG_RELEASE:-issue-46}
    build:
      context: ../../../services/ai-gateway
    restart: "no"
    environment:
      TECHFLOW_RAG_STORE: postgres
      TECHFLOW_RAG_PROVIDER_MODE: mock
      TECHFLOW_RAG_DATABASE_HOST: database
      TECHFLOW_RAG_DATABASE_PORT: "5432"
      TECHFLOW_RAG_DATABASE_NAME: ${TECHFLOW_RAG_DATABASE_NAME:-techflow_rag}
      TECHFLOW_RAG_DATABASE_USER: techflow_rag_migration_login
      TECHFLOW_RAG_DATABASE_PASSWORD_FILE: /run/secrets/migration_password
    command: ["python", "scripts/migrate.py", "up"]
    secrets:
      - migration_password
    depends_on:
      database:
        condition: service_healthy
    networks:
      - rag_internal
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  source-mirror-init:
    image: techflow/ai-gateway:${TECHFLOW_RAG_RELEASE:-issue-46}
    build:
      context: ../../../services/ai-gateway
    user: "0:0"
    command: ["sh", "-c", "chown 10001:10001 /var/lib/techflow-source-mirrors && chmod 0700 /var/lib/techflow-source-mirrors"]
    volumes:
      - techflow_source_mirrors:/var/lib/techflow-source-mirrors
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"
    network_mode: none

  artifact-init:
    image: techflow/ai-gateway:${TECHFLOW_RAG_RELEASE:-issue-58}
    build:
      context: ../../../services/ai-gateway
    user: "0:0"
    command: ["sh", "-c", "chown 10001:10001 /var/lib/techflow-artifacts && chmod 0700 /var/lib/techflow-artifacts"]
    volumes:
      - techflow_artifacts:/var/lib/techflow-artifacts
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    network_mode: none

  community-poller-init:
    image: techflow/ai-gateway:${TECHFLOW_RAG_RELEASE:-issue-21}
    build:
      context: ../../../services/ai-gateway
    user: "0:0"
    command: ["sh", "-c", "chown 10001:10001 /var/lib/techflow-community-poller && chmod 0700 /var/lib/techflow-community-poller"]
    volumes:
      - techflow_community_poller:/var/lib/techflow-community-poller
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    network_mode: none

  gateway:
    image: techflow/ai-gateway:${TECHFLOW_RAG_RELEASE:-issue-46}
    build:
      context: ../../../services/ai-gateway
    restart: unless-stopped
    environment:
      TECHFLOW_RAG_ENVIRONMENT: test-server
      TECHFLOW_RAG_STORE: postgres
      TECHFLOW_RAG_PROVIDER_MODE: mock
      TECHFLOW_RAG_CLASSIFICATION: D0
      TECHFLOW_RAG_DATABASE_HOST: database
      TECHFLOW_RAG_DATABASE_PORT: "5432"
      TECHFLOW_RAG_DATABASE_NAME: ${TECHFLOW_RAG_DATABASE_NAME:-techflow_rag}
      TECHFLOW_RAG_DATABASE_USER: techflow_rag_app_login
      TECHFLOW_RAG_DATABASE_PASSWORD_FILE: /run/secrets/app_password
      TECHFLOW_SOURCE_MIRROR_ROOT: /var/lib/techflow-source-mirrors
      TECHFLOW_ARTIFACT_ROOT: /var/lib/techflow-artifacts
      TECHFLOW_ARTIFACT_RETENTION_HOURS: "24"
      TECHFLOW_ARTIFACT_MAX_BYTES: "10485760"
      TECHFLOW_ARTIFACT_MAX_EXTRACTED_BYTES: "20971520"
      TECHFLOW_ARTIFACT_MAX_ARCHIVE_ENTRIES: "100"
      TECHFLOW_ARTIFACT_MAX_COMPRESSION_RATIO: "20"
      TECHFLOW_ARTIFACT_MAX_LOG_EVIDENCE_CHARS: "120000"
      TECHFLOW_FLARUM_BASE_URL: ${TECHFLOW_FLARUM_BASE_URL:-https://community.ablecloud.io}
      TECHFLOW_FLARUM_PUBLIC_URL: ${TECHFLOW_FLARUM_PUBLIC_URL:-https://community.ablecloud.io}
      TECHFLOW_FLARUM_API_KEY_FILE: /run/secrets/flarum_api_key
      TECHFLOW_FLARUM_ASSISTANT_USER_ID_FILE: /run/secrets/flarum_assistant_user_id
      TECHFLOW_COMMUNITY_PUBLISH_ENABLED: ${TECHFLOW_COMMUNITY_PUBLISH_ENABLED:-false}
      TECHFLOW_COMMUNITY_REVIEW_POST_ENABLED: ${TECHFLOW_COMMUNITY_REVIEW_POST_ENABLED:-false}
      TECHFLOW_CHAT_BOT_ENABLED: ${TECHFLOW_CHAT_BOT_ENABLED:-false}
      TECHFLOW_CHAT_BASE_URL: ${TECHFLOW_CHAT_BASE_URL:-https://chat.ablecloud.io}
      TECHFLOW_CHAT_BOT_TOKEN_FILE: /run/secrets/chat_bot_token
      TECHFLOW_CHAT_REVIEWER_USERNAMES: ${TECHFLOW_CHAT_REVIEWER_USERNAMES:-}
      TECHFLOW_COMMUNITY_APPROVE_WEBHOOK_FILE: /run/secrets/community_approve_webhook
      TECHFLOW_COMMUNITY_REJECT_WEBHOOK_FILE: /run/secrets/community_reject_webhook
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8090", "--no-access-log"]
    secrets:
      - app_password
      - flarum_api_key
      - flarum_assistant_user_id
      - chat_bot_token
      - community_approve_webhook
      - community_reject_webhook
    depends_on:
      migrate:
        condition: service_completed_successfully
      source-mirror-init:
        condition: service_completed_successfully
      artifact-init:
        condition: service_completed_successfully
    ports:
      - "${TECHFLOW_RAG_BIND_ADDRESS:-127.0.0.1}:18090:8090"
    networks:
      rag_internal:
      rag_edge:
      ap_automation:
        ipv4_address: 172.30.19.3
        aliases:
          - techflow-ai-gateway
    volumes:
      - techflow_source_mirrors:/var/lib/techflow-source-mirrors
      - techflow_artifacts:/var/lib/techflow-artifacts
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s

  source-reconciler:
    image: techflow/ai-gateway:${TECHFLOW_RAG_RELEASE:-issue-46}
    restart: unless-stopped
    environment:
      TECHFLOW_GATEWAY_URL: http://gateway:8090
      TECHFLOW_SOURCE_RECONCILE_INTERVAL_SECONDS: "21600"
    command: ["python", "scripts/reconcile_sources.py"]
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - rag_edge
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  community-poller:
    image: techflow/ai-gateway:${TECHFLOW_RAG_RELEASE:-issue-21}
    restart: unless-stopped
    environment:
      TECHFLOW_FLARUM_BASE_URL: ${TECHFLOW_FLARUM_BASE_URL:-https://community.ablecloud.io}
      TECHFLOW_FLARUM_PUBLIC_URL: ${TECHFLOW_FLARUM_PUBLIC_URL:-https://community.ablecloud.io}
      TECHFLOW_FLARUM_API_KEY_FILE: /run/secrets/flarum_api_key
      TECHFLOW_COMMUNITY_INGEST_WEBHOOK_FILE: /run/secrets/community_ingest_webhook
      TECHFLOW_COMMUNITY_POLL_INTERVAL_SECONDS: ${TECHFLOW_COMMUNITY_POLL_INTERVAL_SECONDS:-10}
      TECHFLOW_GATEWAY_URL: http://gateway:8090
      TECHFLOW_COMMUNITY_POLLER_STATE: /var/lib/techflow-community-poller/state.json
    command: ["python", "scripts/poll_flarum.py"]
    depends_on:
      community-poller-init:
        condition: service_completed_successfully
    secrets:
      - flarum_api_key
      - community_ingest_webhook
    networks:
      rag_edge:
      ap_automation:
        ipv4_address: 172.30.19.4
    volumes:
      - techflow_community_poller:/var/lib/techflow-community-poller
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

networks:
  rag_internal:
    internal: true
  rag_edge:
    driver: bridge
  ap_automation:
    external: true
    name: techflow-activepieces_automation_egress

volumes:
  techflow_rag_database:
  techflow_source_mirrors:
  techflow_artifacts:
  techflow_community_poller:

secrets:
  bootstrap_password:
    file: ${TECHFLOW_RAG_BOOTSTRAP_PASSWORD_FILE:?set bootstrap password file}
  app_password:
    file: ${TECHFLOW_RAG_APP_PASSWORD_FILE:?set app password file}
  migration_password:
    file: ${TECHFLOW_RAG_MIGRATION_PASSWORD_FILE:?set migration password file}
  fetcher_password:
    file: ${TECHFLOW_RAG_FETCHER_PASSWORD_FILE:?set fetcher password file}
  flarum_api_key:
    file: ${TECHFLOW_FLARUM_API_KEY_SECRET_FILE:?set Flarum API key file}
  flarum_assistant_user_id:
    file: ${TECHFLOW_FLARUM_ASSISTANT_USER_ID_SECRET_FILE:?set Flarum assistant user ID file}
  community_ingest_webhook:
    file: ${TECHFLOW_COMMUNITY_INGEST_WEBHOOK_SECRET_FILE:?set Community ingest webhook file}
  community_approve_webhook:
    file: ${TECHFLOW_COMMUNITY_APPROVE_WEBHOOK_SECRET_FILE:?set Community approve webhook file}
  community_reject_webhook:
    file: ${TECHFLOW_COMMUNITY_REJECT_WEBHOOK_SECRET_FILE:?set Community reject webhook file}
  chat_bot_token:
    file: ${TECHFLOW_CHAT_BOT_TOKEN_SECRET_FILE:?set Chat Bot token file}
